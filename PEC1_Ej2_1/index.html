<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form validator</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div class="form-card">
        <div class="form-header">
          <h1>Register with us</h1>
          <p>It's free and only takes a minute!</p>
        </div>

        <form id="form">
          <div class="form-section" id="section-username">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                autocomplete="off"
              />
              <span class="input-icon">◉</span>
            </div>
            <small class="feedback"></small>
          </div>

          <div class="form-section" id="section-email">
            <label for="email">Email</label>
            <div class="input-wrapper">
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email"
                autocomplete="off"
              />
              <span class="input-icon">◉</span>
            </div>
            <small class="feedback"></small>
          </div>

          <div class="form-section" id="section-password">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="off"
              />
              <span class="input-icon">◉</span>
            </div>
            <small class="feedback"></small>
            <div class="password-security" id="security-bar">
              <div class="security-track">
                <div id="securityFill" class="security-fill"></div>
              </div>
              <span id="securityLabel" class="security-label"></span>
            </div>
            <ul id="passwordRules" class="password-rules">
              <li id="rule-length">At least 8 characters</li>
              <li id="rule-upper">At least one uppercase letter</li>
              <li id="rule-lower">At least one lowercase letter</li>
              <li id="rule-number">At least one number</li>
              <li id="rule-symbol">At least one special character</li>
            </ul>
          </div>

          <div class="form-section" id="section-password2">
            <label for="password2">Confirm Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password2"
                name="password2"
                placeholder="Enter password again"
                autocomplete="off"
              />
              <span class="input-icon">◉</span>
            </div>
            <small class="feedback"></small>
          </div>

          <button type="submit" class="btn-submit"> 
            <span>Submit</span>
          </button>
          
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
